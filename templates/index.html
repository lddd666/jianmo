<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐墨 - E-ink Wallpaper Studio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="a4beedcd-7d16-491c-a25f-4283d4611731"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>渐墨</h1>
            <p class="subtitle">E-ink Wallpaper Studio</p>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel: Upload & Preview -->
            <div class="preview-panel">
                <!-- Upload Area -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <p class="upload-text">拖拽图片到此处，或点击选择文件</p>
                    <p class="upload-hint">支持 JPG、PNG、BMP、GIF、WebP、TIFF 格式，最大 10MB</p>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>

                <!-- Preview Area -->
                <div class="preview-area" id="previewArea" style="display: none;">
                    <div class="preview-toolbar">
                        <span class="preview-info" id="previewInfo"></span>
                        <div class="preview-tabs">
                            <button class="tab-btn active" id="tabEffect" data-tab="effect">效果图</button>
                            <button class="tab-btn" id="tabOriginal" data-tab="original">原图</button>
                        </div>
                        <div class="preview-actions">
                            <button class="btn btn-sm" id="btnResetImage" title="重新上传">🔄 重新上传</button>
                        </div>
                    </div>
                    <div class="preview-container" id="previewContainer">
                        <div class="preview-wrapper" id="previewWrapper">
                            <img id="previewImage" alt="预览图片">
                            <!-- Crop Overlay -->
                            <div class="crop-overlay" id="cropOverlay" style="display: none;">
                                <div class="crop-shade crop-shade-top" id="cropShadeTop"></div>
                                <div class="crop-shade crop-shade-bottom" id="cropShadeBottom"></div>
                                <div class="crop-shade crop-shade-left" id="cropShadeLeft"></div>
                                <div class="crop-shade crop-shade-right" id="cropShadeRight"></div>
                                <div class="crop-box" id="cropBox">
                                    <div class="crop-dimensions" id="cropDimensions"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="preview-loading" id="previewLoading" style="display: none;">
                        <div class="spinner"></div>
                        <p>正在处理图片...</p>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Controls -->
            <div class="controls-panel">
                <!-- Action Buttons (top of right panel) -->
                <div class="control-section action-section">
                    <button class="btn btn-primary btn-lg" id="btnPreview" disabled>
                        👁️ 生成预览
                    </button>
                    <button class="btn btn-success btn-lg" id="btnDownload" disabled>
                        ⬇️ 下载壁纸
                    </button>
                </div>

                <!-- Preset Schemes (expanded) -->
                <div class="control-section preset-section" data-section="preset">
                    <div class="section-header" data-toggle="preset">
                        <h3 class="section-title">💾 预设方案</h3>
                        <div class="section-header-actions">
                            <button class="btn-reset" data-reset="preset" title="重置" onclick="event.stopPropagation()">↺</button>
                            <span class="collapse-icon">▼</span>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label>加载预设</label>
                            <div class="preset-select-row">
                                <select id="presetSelect" class="form-control">
                                    <option value="">-- 选择预设方案 --</option>
                                </select>
                                <button class="btn btn-sm btn-primary" id="btnLoadPreset" title="加载" disabled>加载</button>
                                <button class="btn btn-sm btn-danger" id="btnDeletePreset" title="删除" disabled>🗑</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>保存当前设置</label>
                            <div class="preset-save-row">
                                <input type="text" id="presetName" class="form-control" placeholder="输入预设名称..." maxlength="30">
                                <button class="btn btn-sm btn-success" id="btnSavePreset">保存</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Device Preset (expanded) -->

                <!-- Crop Section (expanded) -->
                <div class="control-section" data-section="crop">
                    <div class="section-header" data-toggle="crop">
                        <h3 class="section-title">✂️ 区域裁剪</h3>
                        <div class="section-header-actions">
                            <button class="btn-reset" data-reset="crop" title="重置" onclick="event.stopPropagation()">↺</button>
                            <span class="collapse-icon">▼</span>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="enableCrop"> 启用区域选择
                            </label>
                        </div>
                        <div id="cropControls" style="display: none;">
                            <p class="crop-hint">裁剪框按目标设备比例自动锁定，使用滑块选择区域位置</p>
                            <div class="crop-info" id="cropInfo">
                                <span id="cropInfoText">裁剪区域：全图</span>
                            </div>
                            <div id="cropSliderXGroup" class="form-group" style="display: none;">
                                <label>水平位置 <span class="slider-value" id="cropSliderXValue">0</span></label>
                                <input type="range" id="cropSliderX" class="form-range" min="0" max="100" step="1" value="0">
                            </div>
                            <div id="cropSliderYGroup" class="form-group" style="display: none;">
                                <label>垂直位置 <span class="slider-value" id="cropSliderYValue">0</span></label>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Grayscale Method (collapsed) -->
                <div class="control-section collapsed" data-section="grayscale">
                    <div class="section-header" data-toggle="grayscale">
                        <h3 class="section-title">🎨 灰度转换</h3>
                        <div class="section-header-actions">

                                <option value="average">平均值</option>
                                <option value="desaturation">去饱和度</option>
                                <option value="red_channel">红色通道</option>
                                <option value="green_channel">绿色通道</option>
                                <option value="blue_channel">蓝色通道</option>

                    </div>

                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label>对比度 <span class="slider-value" id="contrastValue">1.0</span></label>
                            <input type="range" id="contrast" class="form-range" min="0" max="3" step="0.05" value="1">
                        </div>
                        <div class="form-group">

                            <input type="range" id="brightness" class="form-range" min="0" max="3" step="0.05" value="1">
                        </div>
                        <div class="form-group">
                            <label>锐度 <span class="slider-value" id="sharpnessValue">1.0</span></label>
                            <input type="range" id="sharpness" class="form-range" min="0" max="5" step="0.1" value="1">
                        </div>
                        <div class="form-group">
                            <label>伽马校正 <span class="slider-value" id="gammaValue">1.0</span></label>
                            <input type="range" id="gamma" class="form-range" min="0.1" max="5" step="0.05" value="1">
                        </div>
                        <div class="form-group">
                            <label>高斯模糊 <span class="slider-value" id="blurValue">0</span></label>
                            <input type="range" id="blur" class="form-range" min="0" max="10" step="0.5" value="0">
                        </div>
                    </div>
                </div>

                <!-- Dithering (collapsed) -->
                <div class="control-section collapsed" data-section="dithering">
                    <div class="section-header" data-toggle="dithering">
                        <h3 class="section-title">🔳 抖动算法</h3>
                        <div class="section-header-actions">
                            <button class="btn-reset" data-reset="dithering" title="重置" onclick="event.stopPropagation()">↺</button>
                            <span class="collapse-icon">▶</span>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <select id="ditherMethod" class="form-control">
                                <option value="none">无抖动 - 灰度保留 (推荐)</option>
                                <option value="floyd_steinberg">Floyd-Steinberg</option>
                                <option value="ordered_4">有序抖动 4×4</option>
                                <option value="ordered_8">有序抖动 8×8</option>
                                <option value="atkinson">Atkinson</option>
                                <option value="threshold">固定阈值</option>
                            </select>
                        </div>
                        <div class="form-group" id="thresholdGroup" style="display: none;">
                            <label>阈值 <span class="slider-value" id="thresholdValue">128</span></label>
                            <input type="range" id="threshold" class="form-range" min="0" max="255" step="1" value="128">
                        </div>
                    </div>
                </div>

                <!-- Transform & Other Options (expanded) -->
                <div class="control-section" data-section="other">
                    <div class="section-header" data-toggle="other">
                        <h3 class="section-title">🔄 旋转翻转 & 其他</h3>
                        <div class="section-header-actions">
                            <button class="btn-reset" data-reset="other" title="重置" onclick="event.stopPropagation()">↺</button>
                            <span class="collapse-icon">▼</span>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label>旋转</label>
                            <div class="btn-group-row">
                                <button class="btn btn-sm" id="btnRotateLeft" title="逆时针90°">↺ 90°</button>
                                <button class="btn btn-sm" id="btnRotate180" title="旋转180°">↕ 180°</button>
                                <button class="btn btn-sm" id="btnRotateRight" title="顺时针90°">↻ 90°</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>翻转</label>
                            <div class="btn-group-row">
                                <button class="btn btn-sm" id="btnFlipH" title="水平翻转">↔ 水平</button>
                                <button class="btn btn-sm" id="btnFlipV" title="垂直翻转">↕ 垂直</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="invertColors"> 反转颜色（黑变白，白变黑）
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Output Format (expanded) -->
                <div class="control-section" data-section="output">
                    <div class="section-header" data-toggle="output">
                        <h3 class="section-title">💾 输出设置</h3>
                        <div class="section-header-actions">
                            <button class="btn-reset" data-reset="output" title="重置" onclick="event.stopPropagation()">↺</button>
                            <span class="collapse-icon">▼</span>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label>输出格式</label>
                            <select id="outputFormat" class="form-control">
                                <option value="png">PNG (无损)</option>
                                <option value="bmp">BMP (无压缩)</option>
                                <option value="jpg">JPEG</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>渐墨 · 让每一帧画面都如纸墨般沉静</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
